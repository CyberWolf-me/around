name: Mobile Release Train

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_channel:
        description: 'Release track'
        required: true
        default: 'internal-testflight'
        type: choice
        options:
          - internal-testflight
          - closed-beta
          - production-staged-10pct

jobs:
  build-flutter-android:
    name: Build Flutter Android Release (AAB & APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Flutter verification suite
        run: |
          flutter analyze
          flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Android Release APK
        uses: actions/upload-artifact@v4
        with:
          name: around-android-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  build-web-companion:
    name: Build & Package Web Companion Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run verification tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Upload web companion artifact
        uses: actions/upload-artifact@v4
        with:
          name: around-web-companion-build
          path: dist/
          retention-days: 14
