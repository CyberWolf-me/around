name: CI Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-database:
    name: Supabase PostgreSQL · Migrations 00001–00006 & RLS Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack & apply migrations + seed.sql
        run: |
          supabase start
          supabase db reset

      - name: Execute multi-user RLS authorization test suite
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 \
            -f supabase/tests/rls_authorization_test.sql

  validate-flutter:
    name: Flutter Mobile · Analyze, Tests & Debug APK Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run Dart static analyzer
        run: flutter analyze

      - name: Run Flutter unit and widget tests
        run: flutter test

      - name: Build Android Debug APK
        run: flutter build apk --debug

  validate-web:
    name: Web Reference · Type Check, Vitest & Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict compilation
        run: npm run lint

      - name: Automated test suite (Vitest)
        run: npm run test

      - name: Production bundle build
        run: npm run build
