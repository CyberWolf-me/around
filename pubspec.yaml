name: around_app
description: "Around - Places-first social discovery platform"
publish_to: 'none'
version: 1.2.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^17.5.0
  supabase_flutter: ^2.18.3
  google_fonts: ^8.2.1
  intl: ^0.20.3
  image_picker: ^1.2.4
  uuid: ^4.6.0
